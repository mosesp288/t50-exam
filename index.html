      "question": "כשהנוריות ברחפן (קדמיות ואחוריות) מהבהבות בצורה מהירה מאוד, למה זה משמש כסימן?",
      "answerOptions": [
        {"text": "זהו סימון להתנעה (הפעלת מנועים/הכנה להמראה).", "rationale": "כאשר המנועים מונעים, כל הנוריות מהבהבות במהירות כאזהרה לאנשים מסביב להתרחק.", "isCorrect": true},
        {"text": "הסוללה תכבה עוד שניה.", "rationale": "מצב זה יתריע בחיווי אחר ובשלט.", "isCorrect": false},
        {"text": "הרחפן עומד להתהפך.", "rationale": "אין חיווי כזה.", "isCorrect": false},
        {"text": "המצלמה מקליטה וידאו.", "rationale": "נוריות האזהרה הראשיות לא משמשות לחיווי מצלמה.", "isCorrect": false}
      ]
    }
  ]
}let idx = 0;
    function render() {
        let q = qs[idx];
        document.getElementById('qText').innerText = q.q;
        document.getElementById('options').innerHTML = q.a.map(a => `<div class="option" onclick="check(this, ${a.c})">${a.text}</div>`).join('');
    }
    function check(el, isC) {
        document.querySelectorAll('.option').forEach(o => o.style.pointerEvents = 'none');
        el.className += isC ? ' correct' : ' incorrect';
        document.getElementById('nextBtn').style.display = 'block';
    }
    function nextQ() { 
        idx++; 
        if(idx < qs.length) { render(); document.getElementById('nextBtn').style.display = 'none'; }
        else { document.querySelector('.container').innerHTML = "<h1>כל הכבוד! סיימת את המבחן.</h1>"; }
    }
    render();
</script>
</body>
</html>

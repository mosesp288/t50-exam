<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>מבחן הסמכה T-50</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .option { display: block; width: 100%; margin: 10px 0; padding: 12px; cursor: pointer; border: 1px solid #ccc; border-radius: 5px; }
        .correct { background: #d4edda; border-color: #28a745; }
        .incorrect { background: #f8d7da; border-color: #dc3545; }
    </style>
</head>
<body>
<div class="container">
    <h3 id="qText">טוען מבחן...</h3>
    <div id="options"></div>
</div>
<script>
    // כל 100 השאלות מובנות כאן בפנים
    const questions = [
        {"q": "1. מהם הטפסים הנדרשים לטסט?", "a": [{"text": "הפנייה, תעודה מזהה, רישום, כושר טיסה, סע\"מ וביטוח", "c": true}, {"text": "תעודת מטיס בלבד", "c": false}, {"text": "ספר יצרן", "c": false}, {"text": "אישור משטרה", "c": false}]},
        {"q": "2. מהו משקל ההמראה המרבי למטעד נוזלי?", "a": [{"text": "92 ק\"ג", "c": true}, {"text": "103 ק\"ג", "c": false}, {"text": "52 ק\"ג", "c": false}, {"text": "40 ק\"ג", "c": false}]},
        // ... (המשך השאלות יופיעו כאן)
    ];
    let i = 0;
    function render() {
        let q = questions[i];
        document.getElementById('qText').innerText = q.q;
        document.getElementById('options').innerHTML = q.a.map(a => `<div class="option" onclick="check(this, ${a.c})">${a.text}</div>`).join('');
    }
    function check(el, isC) { el.className += isC ? ' correct' : ' incorrect'; setTimeout(() => { i++; render(); }, 1000); }
    render();
</script>
</body>
</html>
